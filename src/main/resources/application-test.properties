# projectimda shundey warning chiqyapti, bu warning nimaga chiqyapti va  spring.jpa.open-in-view  - bu
# nima va u enable tursa nima bo'ladiyu, disable tursa nima bo'ladi

#Bu warning Spring Boot ichidagi **Open Session in View (OSIV)** mexanizmi sabab chiqyapti.
#
#Sizdagi warning:
#
#```text
#spring.jpa.open-in-view is enabled by default.
#Therefore, database queries may be performed during view rendering.
#Explicitly configure spring.jpa.open-in-view to disable this warning
#```
#
#ma?nosi:
#
#> Hibernate/JPA session request tugaguncha ochiq qoladi va controller?dan keyin ham (view render paytida ham) database query ishlashi mumkin.
#
#---
#
## `spring.jpa.open-in-view` nima?
#
#Bu setting `true` bo?lsa:
#
#* HTTP request boshlanganda Hibernate session ochiladi
#* Controller ishlaydi
#* Service ishlaydi
#* Transaction tugasa ham session yopilmaydi
#* Response qaytguncha session ochiq qoladi
#
#Shu sababli `LAZY` relation?lar keyinroq ham yuklanishi mumkin.
#
#Misol:
#
#```java
#@Entity
#class User {
#
#    @OneToMany(fetch = FetchType.LAZY)
#    private List<Order> orders;
#}
#```
#
#Controller:
#
#```java
#@GetMapping("/users/{id}")
#public User getUser(@PathVariable Long id) {
#    return userService.findById(id);
#}
#```
#
#Agar `open-in-view=true` bo?lsa:
#
#JSON serialize paytida:
#
#```java
#user.getOrders()
#```
#
#chaqirilsa ham ishlaydi, chunki Hibernate session hali ochiq.
#
#---
#
## Enable (`true`) bo?lsa nima bo?ladi?
#
#Default holat:
#
#```properties
#spring.jpa.open-in-view=true
#```
#
#Afzalliklari:
#
#* `LazyInitializationException` kam chiqadi
#* Oddiy CRUD projectlarda qulay
#* DTO yozmasdan entity qaytarish ?ishlab ketadi?
#
#Kamchiliklari:
#
#### 1. Hidden query?lar
#
#Response serialize paytida qo?shimcha query ketadi.
#
#Masalan:
#
#```java
#return user;
#```
#
#JSON convert vaqtida:
#
#```sql
#select * from orders where user_id=?
#```
#
#ketib qoladi.
#
#Developer sezmay qoladi.
#
#---
#
#### 2. N+1 query problem
#
#1 ta user emas, 100 ta user serialize bo?lsa:
#
#```sql
#1 query users
#100 query orders
#```
#
#bo?lib ketadi.
#
#Performance yomonlashadi.
#
#---
#
#### 3. Layer architecture buziladi
#
#Ideal architecture:
#
#```text
#Controller
# -> Service
#    -> Repository
#```
#
#DB access faqat service ichida bo?lishi kerak.
#
#OSIV yoqilganida esa:
#
#```text
#JSON serializer
#View layer
#```
#
#ham database urib yuboradi.
#
#Bu clean architecture?ga zid.
#
#---
#
#### 4. Production?da xavfli
#
#Katta projectlarda:
#
#* query count nazoratdan chiqadi
#* performance pasayadi
#* debugging qiyinlashadi
#
#Shu sabab ko?p senior developerlar disable qiladi.
#
#---
#
## Disable (`false`) bo?lsa nima bo?ladi?
#
#```properties
#spring.jpa.open-in-view=false
#```
#
#Hibernate session transaction tugashi bilan yopiladi.
#
#Endi service?dan tashqarida lazy object ishlatilsa:
#
#```text
#LazyInitializationException
#```
#
#chiqadi.
#
#Masalan:
#
#```java
#return user;
#```
#
#JSON serialize paytida:
#
#```java
#user.getOrders()
#```
#
#lazy load qilmoqchi bo?lsa:
#
#```text
#could not initialize proxy - no Session
#```
#
#xatosi chiqadi.
#
#---
#
## Disable qilinganda to?g?ri approach qanday?
#
#### 1. DTO ishlatish
#
#Eng recommended approach.
#
#```java
#record UserDto(
#    Long id,
#    String name,
#    List<OrderDto> orders
#) {}
#```
#
#Service ichida kerakli data fetch qilinadi.
#
#---
#
#### 2. FETCH JOIN ishlatish
#
#```java
#@Query("""
#select u from User u
#join fetch u.orders
#where u.id = :id
#""")
#User findUserWithOrders(Long id);
#```
#
#---
#
#### 3. EntityGraph ishlatish
#
#```java
#@EntityGraph(attributePaths = "orders")
#User findById(Long id);
#```
#
#---
#
## Qaysi biri yaxshi?
#
### Kichik project / learning project
#
#`open-in-view=true`
#
#muammo emas.
#
#---
#
### Production / katta backend
#
#Tavsiya:
#
#```properties
#spring.jpa.open-in-view=false
#```
#
#va:
#
#* DTO
#* fetch join
#* entity graph
#
#ishlatish.
#
#---
#
## Warning?ni yo?qotish
#
#Agar consciously enable qoldirmoqchi bo?lsangiz:
#
#```properties
#spring.jpa.open-in-view=true
#```
#
#explicit yozing.
#
#Yoki disable qiling:
#
#```properties
#spring.jpa.open-in-view=false
#```
#
#Warning yo?qoladi.
#
#---
#
## Qisqa summary
#
#| Holat   | Natija                                             |
#| ------- | -------------------------------------------------- |
#| `true`  | Session request oxirigacha ochiq                   |
#| `true`  | Lazy loading controller/view?da ham ishlaydi       |
#| `true`  | Hidden query va N+1 xavfi                          |
#| `false` | Session service/transaction tugashi bilan yopiladi |
#| `false` | Lazy object tashqarida ishlamaydi                  |
#| `false` | Architecture va performance yaxshiroq              |
#
#Ko?p production backend?larda:
#
#```properties
#spring.jpa.open-in-view=false
#```
#
#best practice hisoblanadi.